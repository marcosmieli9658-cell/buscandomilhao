# Merge only into the selected existing HTTPS server after reviewing its other routes.
# Example external prefix; the local synchronizer base URL must preserve this prefix.
# Public callback: https://blessialabs.com.br/api/buscando-milhao/webhook
# Private authenticated sync: https://blessialabs.com.br/api/buscando-milhao/sync/{events,ack}

location = /api/buscando-milhao/webhook {
    access_log off; # Meta verification includes the verification token in the query.
    error_log /dev/null; # Nginx upstream errors can otherwise repeat that query string.
    client_max_body_size 2m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_pass http://127.0.0.1:8790/webhook;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
}

location = /api/buscando-milhao/sync/events {
    access_log off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_pass http://127.0.0.1:8790/sync/events;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Authorization $http_authorization;
    add_header Cache-Control "no-store" always;
}

location = /api/buscando-milhao/sync/ack {
    access_log off;
    client_max_body_size 16k;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_pass http://127.0.0.1:8790/sync/ack;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Authorization $http_authorization;
}

# Health is local only. Do not expose it through another broad proxy location.
location = /api/buscando-milhao/healthz { return 404; }
location ^~ /api/buscando-milhao/ { return 404; }
